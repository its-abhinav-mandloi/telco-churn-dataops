name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting and linting (Ruff)
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests

      - name: Run unit and API tests (pytest)
        run: uv run pytest --cov=telco_churn_dataops --cov-report=term-missing
