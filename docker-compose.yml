services:
  prefect-server:
    build: .
    container_name: telco-prefect-server
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    ports:
      - "4200:4200"
    volumes:
      - prefect-db:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  prefect-worker:
    build: .
    container_name: telco-prefect-worker
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-telco-process-pool}
      DATASET_URL: ${DATASET_URL:-https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv}
    command: >
      sh -c "prefect work-pool create --type process ${PREFECT_WORK_POOL:-telco-process-pool} --overwrite
      && prefect --no-prompt deploy --all
      && prefect worker start --pool ${PREFECT_WORK_POOL:-telco-process-pool}"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  api:
    build: .
    container_name: telco-churn-api
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
      PREFECT_API_KEY: ${PREFECT_API_KEY:-}
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-telco-process-pool}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
    command: ["uvicorn", "telco_churn_dataops.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  dashboard:
    build: .
    container_name: telco-churn-dashboard
    depends_on:
      - api
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL:-http://localhost:4200/api}
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-telco-process-pool}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8501}
    command:
      [
        "streamlit",
        "run",
        "src/telco_churn_dataops/dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

volumes:
  prefect-db:
